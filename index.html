<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naqash Naseeb Bhatti | Social Media Strategist</title>
    <meta name="description" content="Naqash Bhatti is a Social Media Strategist specialising in Meta Ads and organic growth systems.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg: #080810;
            --surf: #0c0c18;
            --card: #111124;
            --acc: #6366f1;
            --acc2: #818cf8;
            --lime: #a3e635;
            --txt: #f1f1f8;
            --mut: #7070a0;
            --mut2: #9090b8;
            --grad: linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a78bfa 100%);
            --font-disp: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --r2: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--txt); font-family: var(--font-body); overflow-x: hidden; }
        
        /* Nav Fix */
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 5%; background: rgba(8,8,16,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-svg { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
        .logo-text { font-family: var(--font-disp); font-size: 1.15rem; font-weight: 800; color: var(--txt); }
        .logo-text span { color: var(--acc2); }
        .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
        .nav-links a { font-size: .85rem; font-weight: 500; color: var(--mut2); text-decoration: none; transition: 0.3s; }
        .nav-links a:hover { color: #fff; }
        .nav-cta { background: var(--lime); color: #080810 !important; padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 700; }

        section { padding: 8rem 5% 4rem; max-width: 1100px; margin: 0 auto; }
        .lbl { font-family: var(--font-disp); font-size: .7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--acc2); margin-bottom: 1rem; display: block; }
        .h2 { font-family: var(--font-disp); font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 2rem; }

        /* Form Styling */
        .form-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 2.5rem; border-radius: var(--r2); }
        .fg { margin-bottom: 1.5rem; }
        .fg label { display: block; font-size: .8rem; color: var(--mut2); margin-bottom: .5rem; }
        .fg input, .fg textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; color: #fff; border-radius: 8px; font-family: inherit; }
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
        .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; font-size: .8rem; transition: 0.2s; }
        .opt-btn.selected { border-color: var(--acc); background: rgba(99,102,241,0.2); }
        .sub-btn { width: 100%; background: var(--lime); color: #000; border: none; padding: 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        .hidden { display: none; }
        .form-steps { display: flex; gap: 10px; margin-bottom: 2rem; align-items: center; }
        .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-size: .8rem; }
        .step-dot.active { background: var(--acc); color: #fff; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo-svg">
        <svg width="32" height="32" viewBox="0 0 38 38" fill="none"><rect width="38" height="38" rx="10" fill="#6366f1"/><path d="M9 28V11h3.8L21.4 24V11h3.8v17h-3.8l-8.6-13v13z" fill="white"/><circle cx="29" cy="9" r="3.5" fill="#a3e635"/></svg>
        <span class="logo-text">Naqash<span>.</span>Bhatti</span>
    </a>
    <ul class="nav-links">
        <li><a href="#results">Results</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#contact" class="nav-cta">Book a Call</a></li>
    </ul>
</nav>

<section id="contact">
    <span class="lbl">Get in Touch</span>
    <h2 class="h2">Let's build your pipeline.</h2>

    <div class="form-card">
        <div class="form-steps">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-dot" id="dot2">2</div>
            <div class="step-dot" id="dot3">3</div>
        </div>

        <form action="https://formspree.io/f/mykozvqg" method="POST" id="mainForm">
            <!-- Step 1 -->
            <div id="step1">
                <div class="fg">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="Full Name">
                </div>
                <div class="fg">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="email@company.com">
                </div>
                <button type="button" class="sub-btn" onclick="goStep(2)">Next Step</button>
            </div>

            <!-- Step 2 -->
            <div id="step2" class="hidden">
                <label class="lbl">What do you need?</label>
                <div class="opt-grid">
                    <div class="opt-btn" onclick="selectService(this, 'Meta Ads')">Meta Ads</div>
                    <div class="opt-btn" onclick="selectService(this, 'Organic Growth')">Organic Growth</div>
                    <div class="opt-btn" onclick="selectService(this, 'Full Management')">Full Management</div>
                    <div class="opt-btn" onclick="selectService(this, 'Audit')">Strategy Audit</div>
                </div>
                <input type="hidden" name="service_requested" id="serviceInput">
                <button type="button" class="sub-btn" onclick="goStep(3)">Final Step</button>
            </div>

            <!-- Step 3 -->
            <div id="step3" class="hidden">
                <div class="fg">
                    <label>Anything else I should know?</label>
                    <textarea name="message" rows="4" placeholder="Briefly describe your goals..."></textarea>
                </div>
                <button type="submit" class="sub-btn">Send Message</button>
            </div>
        </form>
    </div>
</section>

<script>
    function goStep(step) {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('dot1').classList.remove('active');
        document.getElementById('dot2').classList.remove('active');
        document.getElementById('dot3').classList.remove('active');

        document.getElementById('step' + step).classList.remove('hidden');
        document.getElementById('dot' + step).classList.add('active');
    }

    function selectService(el, val) {
        let btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('serviceInput').value = val;
    }
</script>

</body>
</html>
