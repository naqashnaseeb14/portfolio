<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NNB — Social Media Strategist</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090921;
  --bg2:#110839;
  --card:#0f0f2e;
  --border:rgba(255,255,255,.08);
  --txt:#ffffff;
  --mut:#b9b9d6;
  --acc:#6d6cff;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--txt);
  line-height:1.7;
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* NAV */
nav{
  position:fixed;
  top:0;left:0;right:0;
  background:rgba(9,9,33,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 6%;
  z-index:999;
}
.logo img{height:36px}
.nav-links{
  display:flex;
  gap:2rem;
}
.nav-links a{
  font-size:.85rem;
  color:var(--mut);
}
.nav-links a:hover{color:#fff}
.ham{
  display:none;
  flex-direction:column;
  gap:5px;
  background:none;
  border:none;
}
.ham span{
  width:24px;height:2px;
  background:#fff;
}

/* MOBILE NAV */
@media(max-width:800px){
  .ham{display:flex}
  .nav-links{
    position:fixed;
    inset:0;
    background:var(--bg2);
    flex-direction:column;
    justify-content:center;
    align-items:center;
    display:none;
  }
  .nav-links.open{display:flex}
}

/* SECTIONS */
section{padding:7rem 6%}
.wrap{max-width:1100px;margin:auto}

/* HERO */
.hero h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.6rem,6vw,4.8rem);
  line-height:1.05;
}
.hero p{
  max-width:520px;
  margin:1.5rem 0;
  color:var(--mut);
}
.btn{
  display:inline-block;
  background:var(--acc);
  color:#fff;
  padding:.8rem 1.8rem;
  border-radius:40px;
  font-weight:600;
}

/* CONTACT */
.form{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:2rem;
}
.form input,.form select,.form textarea{
  width:100%;
  background:#fff;
  color:#000;
  padding:.7rem;
  border-radius:10px;
  border:none;
}
.form label{
  font-size:.75rem;
  margin-bottom:.3rem;
  display:block;
}
.form .row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
}
@media(max-width:500px){
  .form .row{grid-template-columns:1fr}
}
.form button{
  width:100%;
  margin-top:1rem;
  padding:.9rem;
  border:none;
  background:var(--acc);
  color:#fff;
  border-radius:10px;
  font-weight:700;
}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:2rem 6%;
  text-align:center;
  font-size:.75rem;
  color:var(--mut);
}
</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="logo.png" alt="NNB Logo">
  </div>
  <div class="nav-links" id="navLinks">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </div>
  <button class="ham" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
</nav>

<section id="home" class="hero">
  <div class="wrap">
    <h1>Social Media<br>That Drives Revenue</h1>
    <p>I help UK & European brands generate inbound leads using paid & organic social systems.</p>
    <a href="#contact" class="btn">Book a Strategy Call</a>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <h2>Contact Me</h2>

    <form class="form" action="https://formspree.io/f/mykozvqg" method="POST">
      <div class="row">
        <div>
          <label>First Name</label>
          <input name="first_name" required>
        </div>
        <div>
          <label>Last Name</label>
          <input name="last_name" required>
        </div>
      </div>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Service Needed</label>
      <select name="service">
        <option>Meta Ads</option>
        <option>Organic Strategy</option>
        <option>Full Management</option>
        <option>Website</option>
      </select>

      <label>Message</label>
      <textarea name="message"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</section>

<footer>
  © 2026 Naqash Naseeb Bhatti — NNB
</footer>

<script>
function toggleNav(){
  document.getElementById('navLinks').classList.toggle('open');
}
</script>

</body>
</html>
